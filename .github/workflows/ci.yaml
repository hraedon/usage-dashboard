name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      # Install from uv.lock (WI-027): `--locked` both uses the lockfile and
      # fails if pyproject.toml has drifted from it. `--frozen` would silently
      # accept that drift. The GUI extra is included so the pygame smoke tests
      # below run under SDL's dummy driver rather than being skipped.
      - run: uv sync --locked --extra dev --extra gui

      - name: ruff
        run: .venv/bin/ruff check .

      - name: mypy
        run: .venv/bin/mypy src/usage_dashboard

      - name: pytest
        # The login extra (Playwright) is intentionally omitted: the interactive
        # ollama-login flow is browser-driven and not unit-tested; its pure
        # helpers are, and they do not import Playwright.
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: .venv/bin/pytest
