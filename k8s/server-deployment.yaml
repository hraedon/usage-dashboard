apiVersion: apps/v1
kind: Deployment
metadata:
  name: usage-dashboard-server
  namespace: usage-dashboard
spec:
  replicas: 1
  strategy:
    type: Recreate  # RWO Longhorn PVC: rolling update deadlocks on multi-attach
  selector:
    matchLabels:
      app: usage-dashboard-server
  template:
    metadata:
      labels:
        app: usage-dashboard-server
    spec:
      containers:
        - name: server
          image: ghcr.io/hraedon/usage-dashboard-server:main
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: server-secrets
                  key: api-key
            - name: DB_PATH
              value: "/data/readings.db"
            # DEPRECATED (Plan 005), remove in Phase C once the soak is over.
            # Claude credentials now live in the token store on the PVC, written
            # by `usage-dashboard login claude`. The store is AUTHORITATIVE:
            # these values seed it only when its entry is empty, so they are a
            # migration/rollback net, not the source of truth.
            - name: CLAUDE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: server-secrets
                  key: claude-token
                  optional: true
            - name: CLAUDE_REFRESH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: server-secrets
                  key: claude-refresh-token
                  optional: true
            - name: CLAUDE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: server-secrets
                  key: claude-client-id
                  optional: true
            # Optional second Claude account (e.g. a work login). Leave the
            # secret keys empty to keep it hidden; set them to show a muted
            # second set of Claude bars.
            - name: CLAUDE_WORK_TOKEN
              valueFrom:
                secretKeyRef:
                  name: server-secrets
                  key: claude-work-token
                  optional: true
            - name: CLAUDE_WORK_REFRESH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: server-secrets
                  key: claude-work-refresh-token
                  optional: true
            - name: CLAUDE_WORK_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: server-secrets
                  key: claude-work-client-id
                  optional: true
            - name: ZAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: server-secrets
                  key: zai-api-key
                  optional: true
            # z.ai weekly-window token thresholds that colour the token line
            # (warn/orange, crit/red). Unset = fetcher defaults (~80% / ~95%
            # of the Pro weekly cap); set these if your plan tier differs.
            # - name: ZAI_WEEK_TOKENS_WARN
            #   value: "240000000"
            # - name: ZAI_WEEK_TOKENS_CRIT
            #   value: "285000000"
            - name: OLLAMA_COOKIE
              valueFrom:
                secretKeyRef:
                  name: server-secrets
                  key: ollama-cookie
                  optional: true
            # OpenCode Go needs both halves; either alone leaves it unconfigured.
            - name: OPENCODE_WORKSPACE_ID
              valueFrom:
                secretKeyRef:
                  name: server-secrets
                  key: opencode-workspace-id
                  optional: true
            - name: OPENCODE_COOKIE
              valueFrom:
                secretKeyRef:
                  name: server-secrets
                  key: opencode-cookie
                  optional: true
            # Codex (Plan 005): the official `codex` App Server owns the
            # ChatGPT login, its tokens and their refresh. The dashboard holds
            # no OpenAI credential, so there is nothing to inject here.
            # `app_server` enables the tile; `disabled` hides it (and is what
            # you set temporarily to re-enrol — never run two App Server
            # processes against one CODEX_HOME).
            - name: CODEX_MODE
              value: "app_server"
            # On the PVC, so the login survives pod restarts.
            - name: CODEX_HOME
              value: "/data/codex"
            - name: CODEX_BIN
              value: "/usr/local/bin/codex"
            # Umans wallet (Plan 004): the corner balance line on the Pi.
            # Absent/empty secret key leaves the provider unconfigured.
            - name: UMANS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: server-secrets
                  key: umans-api-key
                  optional: true
            - name: FETCH_INTERVAL
              value: "300"
            - name: PORT
              value: "8080"
            - name: SCHEDULES_DIR
              value: "/etc/usage-dashboard/schedules"
          volumeMounts:
            - name: data
              mountPath: /data
            - name: schedules
              mountPath: /etc/usage-dashboard/schedules
              readOnly: true
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: server-data
        # Per-unit backlight schedules. Optional: if the ConfigMap is absent the
        # mount is empty and the server serves no schedule (clients fall back to
        # their own default). Edit the ConfigMap + rollout restart to update.
        - name: schedules
          configMap:
            name: usage-dashboard-schedules
            optional: true
