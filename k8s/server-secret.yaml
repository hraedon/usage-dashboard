apiVersion: v1
kind: Secret
metadata:
  name: server-secrets
  namespace: usage-dashboard
type: Opaque
# Plan 005 Phase C (2026-11-07): the deprecated claude-*/codex-* seed keys and
# the unused ollama-email/password placeholders are gone. Provider credentials
# live in the token store on the PVC (AUTHORITATIVE), written by
# `usage-dashboard login <provider>` or the /login pane — this Secret now
# carries only API tokens and browser cookies. scripts/verify_drift.py checks
# that this key set matches the live Secret; deploy/cluster-apply.sh
# deliberately does NOT apply this file (placeholders must never clobber live
# values).
stringData:
  api-key: "REPLACE_WITH_SECURE_KEY"
  # Optional distinct credential: read-only access to /api/v1/agent/capacity.
  # Must differ from api-key or the server refuses to start (Plan 008).
  agent-api-key: ""
  zai-api-key: ""
  ollama-cookie: ""
  # Optional OpenCode Go workspace. Scraped like ollama — capture both halves
  # with `usage-dashboard login opencode`. The workspace id is the `wrk_…` in
  # the dashboard URL (stable); opencode-cookie is the `auth` cookie value
  # (rotates on re-login). BOTH must be set or the provider stays hidden.
  # Capture the cookie from a private/incognito window: signing out of a normal
  # session invalidates it, and this one has to outlive the browser session.
  opencode-workspace-id: ""
  opencode-cookie: ""
  # Umans wallet (Plan 004). Absent/empty leaves the provider unconfigured.
  umans-api-key: ""
