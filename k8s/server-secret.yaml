apiVersion: v1
kind: Secret
metadata:
  name: server-secrets
  namespace: usage-dashboard
type: Opaque
stringData:
  api-key: "REPLACE_WITH_SECURE_KEY"
  # DEPRECATED (Plan 005): Claude credentials are no longer provisioned here.
  # Enrol with `usage-dashboard login claude --account personal|work` inside the
  # server pod; it writes straight into the token store on the PVC, which is
  # authoritative. These keys seed an EMPTY store entry only, so an existing
  # deployment keeps working across the upgrade and can roll back.
  # Retain the current values for one soak period, then delete these keys.
  claude-token: ""
  claude-refresh-token: ""
  claude-client-id: ""
  claude-work-token: ""
  claude-work-refresh-token: ""
  claude-work-client-id: ""
  zai-api-key: ""
  ollama-cookie: ""
  # Optional OpenCode Go workspace. Scraped like ollama — capture both halves
  # with `usage-dashboard login opencode`. The workspace id is the `wrk_…` in
  # the dashboard URL (stable); opencode-cookie is the `auth` cookie value
  # (rotates on re-login). BOTH must be set or the provider stays hidden.
  # Capture the cookie from a private/incognito window: signing out of a normal
  # session invalidates it, and this one has to outlive the browser session.
  opencode-workspace-id: ""
  opencode-cookie: ""
  # DEPRECATED (Plan 005) and no longer read by anything: Codex authentication
  # moved to the official App Server, which keeps its own credentials under
  # CODEX_HOME on the PVC. Enrol with `usage-dashboard login codex` in the
  # server pod. Retain these values for one rollback period, then delete the
  # keys — the deployment no longer injects them.
  codex-token: ""
  codex-refresh-token: ""
  codex-client-id: ""
  codex-account-id: ""
  # Unused. Ollama login is a local, human-in-the-loop CLI flow
  # (`usage-dashboard login ollama`) because ollama.com uses WorkOS AuthKit
  # (JS form + anti-bot signal) — there is no unattended server-side login from
  # stored credentials. Kept only as placeholders; safe to remove.
  ollama-email: ""
  ollama-password: ""
